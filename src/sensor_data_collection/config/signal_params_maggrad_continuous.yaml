# FY8300 configuration for MagGrad continuous collection.
# Three square-wave channels are configured once and then run continuously.
# The final 25% of each period is intentionally left off for background.
# The collection node labels each AK snapshot from frequency/phase/duty timing;
# it does not switch channel outputs during recording.

search_ports:
  - "/dev/ttyUSB0"
baudrate: 115200
status_poll_rate: 0.2

initial_configs:
  - channel_index: 1
    waveform: 2
    frequency: 1.0
    amplitude: 5.0
    offset: 2.5
    phase: 0.0
    duty_cycle: 25.0
    output_en: true
    output_sync: true
  - channel_index: 2
    waveform: 2
    frequency: 1.0
    amplitude: 5.0
    offset: 2.5
    phase: 90.0
    duty_cycle: 25.0
    output_en: true
  - channel_index: 3
    waveform: 2
    frequency: 1.0
    amplitude: 5.0
    offset: 2.5
    phase: 180.0
    duty_cycle: 25.0
    output_en: true
